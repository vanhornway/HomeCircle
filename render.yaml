# Render Blueprint — "Deploy to Render" button:
#   https://render.com/deploy?repo=https://github.com/vanhornway/HomeCircle
# A persistent disk needs a paid instance (Starter, ~$7/mo + ~$0.25/GB disk).
# Free instances sleep and lose data, so they won't work for HomeCircle.
services:
  - type: web
    name: homecircle
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: SETUP_TOKEN
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      - key: DATA_DIR
        value: /data
      # "true" runs the circle agent (the optional AI helper) in this server.
      - key: AGENT
        value: "false"
    disk:
      name: homecircle-data
      mountPath: /data
      sizeGB: 1

# The add-on is the regular HomeCircle server image (multi-arch) plus
# Tailscale; Home Assistant builds it on your machine from the Dockerfile.
# Pinned to the server image's commit so each add-on version gets exactly that
# server, even if Home Assistant has an older :latest cached.
build_from:
  aarch64: ghcr.io/vanhornway/homecircle:9d8dc138e1e8a96c77dc20eec7aff02f0dbccfa9
  amd64: ghcr.io/vanhornway/homecircle:9d8dc138e1e8a96c77dc20eec7aff02f0dbccfa9
  armv7: ghcr.io/vanhornway/homecircle:9d8dc138e1e8a96c77dc20eec7aff02f0dbccfa9

; HomeCircle Tracker: firmware for small tracker devices, and a host build
; of the same protocol code for tests. See README.md.

[platformio]
default_envs = t-sim7080g-s3

[env]
lib_deps =
  bblanchon/ArduinoJson@7.2.1
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

; --- ESP32 boards ----------------------------------------------------------

[esp32]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
; One 3 MB app, no over-the-air updates: TLS, Wi-Fi and the modem don't fit the default 1.25 MB.
board_build.partitions = huge_app.csv
build_src_filter = +<firmware/>
lib_deps =
  ${env.lib_deps}
  mobizt/ESP_SSLClient@3.1.3
  arduino-libraries/ArduinoHttpClient@0.6.1

; LilyGO T-SIM7080G-S3: ESP32-S3, SIM7080G (LTE-M / NB-IoT and GNSS), an
; AXP2101 power chip and an 18650 holder. Works anywhere with LTE-M coverage.
[env:t-sim7080g-s3]
extends = esp32
board = esp32-s3-devkitc-1
lib_deps =
  ${esp32.lib_deps}
  vshymanskyy/TinyGSM@0.12.0
  lewisxhe/XPowersLib@0.3.3
build_flags =
  ${env.build_flags}
  -DHC_BOARD_T_SIM7080G_S3
  -DTINY_GSM_MODEM_SIM7080
  -DTINY_GSM_RX_BUFFER=1024
  -DARDUINO_USB_CDC_ON_BOOT=1

; Any ESP32-C3 board with a UART GPS module (ATGM336H, L76K, NEO-6M…).
; Wi-Fi only: it reports whenever it is near a saved network, and keeps an
; SOS until it can send it.
[env:esp32c3-wifi]
extends = esp32
board = esp32-c3-devkitm-1
lib_deps =
  ${esp32.lib_deps}
  mikalhart/TinyGPSPlus@1.1.0
build_flags =
  ${env.build_flags}
  -DHC_BOARD_C3_WIFI
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; --- The same protocol code on this computer, for tests --------------------
; Needs libsodium and libcurl (macOS: brew install libsodium).

[env:native]
platform = native
build_src_filter = +<host/tracker/>
build_flags =
  ${env.build_flags}
  -DHC_HOST
  -I/opt/homebrew/include
  -L/opt/homebrew/lib
  -lsodium
  -lcurl

; The home base's code on this computer (test/homebase.mjs).
[env:native-homebase]
extends = env:native
build_src_filter = +<host/homebase/>

; Meshtastic with the HomeCircle module. build.sh copies this file into the
; Meshtastic checkout at variants/esp32s3/homecircle/platformio.ini.

; Heltec Wireless Tracker (V1.1): ESP32-S3, SX1262 LoRa, GNSS, Wi-Fi.
[env:heltec-wireless-tracker-homecircle]
extends = env:heltec-wireless-tracker
build_flags =
  ${env:heltec-wireless-tracker.build_flags}
  -D HOMECIRCLE
  ; A separate SOS button from this pin to GND (-1: none; SOS by command only).
  -D HC_SOS_PIN=-1
lib_deps =
  ${env:heltec-wireless-tracker.lib_deps}
  bblanchon/ArduinoJson@7.2.1

; The home base: Heltec WiFi LoRa 32 V4 (ESP32-S3, SX1262 with a 28 dBm
; amplifier, 16 MB flash, PSRAM). It sits at home on mains power and Wi-Fi.
[env:heltec-v4-homebase]
extends = env:heltec-v4
build_flags =
  ${env:heltec-v4.build_flags}
  -D HOMECIRCLE_HOMEBASE
lib_deps =
  ${env:heltec-v4.lib_deps}
  bblanchon/ArduinoJson@7.2.1

; Heltec WiFi LoRa 32 V3: no GNSS of its own. As a home base it needs no
; HomeCircle module at all (stock Meshtastic is enough); this build is for
; using one as a tracker with a GPS module wired to it.
[env:heltec-v3-homecircle]
extends = env:heltec-v3
build_flags =
  ${env:heltec-v3.build_flags}
  -D HOMECIRCLE
  -D HC_SOS_PIN=-1
lib_deps =
  ${env:heltec-v3.lib_deps}
  bblanchon/ArduinoJson@7.2.1

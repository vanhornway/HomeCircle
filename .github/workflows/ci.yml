name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: packages/core
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: packages/core
      - run: npm ci
        working-directory: mobile
      - run: npx tsc --noEmit
        working-directory: mobile
      - run: npx expo lint
        working-directory: mobile

  # Multi-arch image (x86 servers + Raspberry Pi) published to GitHub Container Registry.
  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The tests run from the repo, where every package is installed; this
      # checks the image itself starts (agent on) before anyone can pull it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: homecircle:smoke
      - name: Start the image
        run: |
          docker run -d --name smoke -p 127.0.0.1:8080:8080 -e SETUP_TOKEN=ci-smoke-token -e AGENT=true --read-only --tmpfs /tmp homecircle:smoke
          for i in $(seq 1 30); do curl -sf 127.0.0.1:8080/api/v1/info && exit 0; sleep 1; done
          docker logs smoke
          exit 1
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/homecircle:latest,ghcr.io/${{ github.repository_owner }}/homecircle:${{ github.sha }}

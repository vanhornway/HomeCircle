# The bridge is the regular HomeCircle server image, running the bridge
# instead of the server. Pinned to a server image commit at each release (as
# the HomeCircle app is), so each bridge version gets exactly that code.
build_from:
  aarch64: ghcr.io/vanhornway/homecircle:latest
  amd64: ghcr.io/vanhornway/homecircle:latest
  armv7: ghcr.io/vanhornway/homecircle:latest

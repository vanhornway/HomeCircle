# Fly.io — see deploy/README.md#flyio
#   fly launch --copy-config --no-deploy --name <your-app-name>
#   fly volumes create homecircle_data --size 1
#   fly secrets set SETUP_TOKEN=$(openssl rand -base64 18)
#   fly deploy
app = "homecircle-change-me"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  TRUST_PROXY = "true"

[[mounts]]
  source = "homecircle_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine running: phones upload in the background and
  # "Locate" requests must reach the server at any time.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
